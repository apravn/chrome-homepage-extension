<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nook</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #1c1a2b;
      --card: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.65);
      --accent: #6a5cd1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #201d35, #171526);
      color: var(--text);
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    button.action-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease;
    }
    button.action-btn:hover { background: var(--card-hover); }
    button.action-btn:disabled { opacity: 0.5; cursor: default; }
    button.action-btn .icon { font-size: 16px; }

    #status {
      font-size: 12px;
      color: #7fe0a8;
      margin-bottom: 10px;
      min-height: 14px;
    }
    #status.error { color: #ff8a8a; }
    #status[hidden] { display: none; }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin: 0 0 8px;
    }

    #recentList {
      list-style: none;
      margin: 0 0 14px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 160px;
      overflow-y: auto;
    }
    #recentList li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    #recentList li:hover { background: var(--card); }
    #recentList li.empty {
      color: var(--text-dim);
      cursor: default;
      justify-content: center;
      padding: 14px 8px;
    }
    #recentList li.empty:hover { background: transparent; }
    #recentList img {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    #recentList .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #openBoardsBtn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #openBoardsBtn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <h1>🪺 Nook</h1>

  <div class="actions">
    <button id="savePageBtn" class="action-btn" type="button">
      <span class="icon">💾</span>
      <span>Save current page</span>
    </button>
    <button id="saveSelectionBtn" class="action-btn" type="button">
      <span class="icon">✂️</span>
      <span>Save selected text</span>
    </button>
  </div>

  <div id="status" hidden></div>

  <p class="section-title">Recently saved</p>
  <ul id="recentList"></ul>

  <button id="openBoardsBtn" type="button">Open Boards</button>

  <script src="popup.js"></script>
</body>
</html>
